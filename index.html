<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>катамаран</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- акварельный фон -->
    <canvas id="watercolor"></canvas>
    <!-- зерно бумаги -->
    <div class="paper-grain"></div>

    <section class="hero">
        <h1>катамаран</h1>
        <p class="hero-sub">творческая мастерская</p>
        <p class="hero-desc random-phrase"></p>
    </section>

    <!-- волны-аппликация -->
    <div class="waves" aria-hidden="true">
        <svg class="wave wave-1" viewBox="0 0 2400 140" preserveAspectRatio="none">
            <path d="M0,70 C200,115 400,25 600,70 C800,115 1000,25 1200,70 C1400,115 1600,25 1800,70 C2000,115 2200,25 2400,70 L2400,140 L0,140 Z"/>
        </svg>
        <svg class="wave wave-2" viewBox="0 0 2400 140" preserveAspectRatio="none">
            <path d="M0,70 C200,115 400,25 600,70 C800,115 1000,25 1200,70 C1400,115 1600,25 1800,70 C2000,115 2200,25 2400,70 L2400,140 L0,140 Z"/>
        </svg>
        <svg class="wave wave-3" viewBox="0 0 2400 140" preserveAspectRatio="none">
            <path d="M0,70 C200,115 400,25 600,70 C800,115 1000,25 1200,70 C1400,115 1600,25 1800,70 C2000,115 2200,25 2400,70 L2400,140 L0,140 Z"/>
        </svg>
    </div>

    <!-- контакты -->
    <footer class="footer">
        <h2>контакты</h2>
        <div class="contacts">
            <div class="contact-item">
                <h3>почта</h3>
                <p>hello@katamaran.art</p>
            </div>
            <div class="contact-item">
                <h3>телефон</h3>
                <p>+7 900 000-00-00</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p class="random-footer"></p>
        </div>
    </footer>

    <div class="cursor-dot" id="cursorDot"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <script src="chaos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Катамаран</title>

  <!-- Шрифты: Rubik Mono One — для заголовка, Neucha — для текста -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Neucha&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- акварельные пятна на фоне -->
  <div class="stain stain-1"></div>
  <div class="stain stain-2"></div>
  <div class="stain stain-3"></div>
  <div class="stain stain-4"></div>

  <header class="hero">
    <h1 class="title" id="title">КАТАМАРАН</h1>
    <p class="subtitle">путешествие по бумажному морю</p>

    <!-- бумажный кораблик -->
    <div class="boat" id="boat">⛵</div>
  </header>

  <!-- волны-аппликации из «картона» -->
  <div class="sea">
    <svg class="wave wave-1" viewBox="0 0 1440 180" preserveAspectRatio="none">
      <path d="M0,90 C180,30 360,150 540,90 C720,30 900,150 1080,90 C1260,30 1380,120 1440,90 L1440,180 L0,180 Z"/>
    </svg>
    <svg class="wave wave-2" viewBox="0 0 1440 180" preserveAspectRatio="none">
      <path d="M0,100 C200,160 400,40 600,100 C800,160 1000,40 1200,100 C1320,135 1400,80 1440,100 L1440,180 L0,180 Z"/>
    </svg>
    <svg class="wave wave-3" viewBox="0 0 1440 180" preserveAspectRatio="none">
      <path d="M0,110 C160,60 320,150 480,110 C640,70 800,150 960,110 C1120,70 1280,150 1440,110 L1440,180 L0,180 Z"/>
    </svg>
  </div>

  <main class="content">
    <section class="card">
      <h2>О проекте</h2>
      <p>Здесь будет текст про катамаран. Замени его на свой.</p>
    </section>
  </main>

  <!-- бумажная фактура поверх всего -->
  <div class="paper-grain"></div>

  <script src="script.js"></script>
</body>
</html>
